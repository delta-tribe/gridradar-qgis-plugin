name: Release

# Runs in the public mirror. Tags vX.Y.Z are pushed there from the monorepo.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check metadata version matches the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          tag_version="${TAG#v}"
          metadata_version="$(grep '^version=' metadata.txt | cut -d= -f2)"
          if [ "$metadata_version" != "$tag_version" ]; then
            echo "metadata.txt version ($metadata_version) does not match tag ($TAG)"
            exit 1
          fi

      - name: Build plugin zip
        run: python scripts/build_release.py --no-verify

      - name: Create GitHub release with the zip
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/*.zip --title "$TAG" --notes "GridRadar QGIS plugin $TAG"
