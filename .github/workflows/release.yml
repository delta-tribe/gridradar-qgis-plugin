name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: pip install -r scripts/requirements-build.txt

      - name: Check metadata version matches release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          tag_version="${RELEASE_TAG#v}"
          metadata_version="$(grep '^version=' metadata.txt | cut -d= -f2)"
          if [ "$metadata_version" != "$tag_version" ]; then
            echo "metadata.txt version ($metadata_version) does not match release tag ($tag_version)"
            exit 1
          fi

      - name: Build obfuscated plugin zip
        run: python scripts/build_release.py --no-verify

      - name: Upload zip to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            dist/*.zip \
            --clobber
